services:
  - type: web
    name: gjfortunesinais
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: site-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SITE_DATA_DIR
        value: /var/data
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_SECRET_KEY
        generateValue: true

  - type: worker
    name: santos-bot
    runtime: python
    rootDir: bot_santos
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot.py
    disk:
      name: santos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SANTOS_DATA_DIR
        value: /var/data
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: GIPHY_API_KEY
        sync: false
